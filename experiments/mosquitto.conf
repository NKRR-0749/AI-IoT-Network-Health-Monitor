# Mosquitto config for this project.
#   mosquitto -c experiments/mosquitto.conf -v
# 1883: collector + devices without impairment
# 1884: devices whose traffic is impaired by netem (Linux/WSL2 only, see src/iotmon/impair/netem.py)
listener 1883
listener 1884
allow_anonymous true
# Local development only: no passwords, no TLS. Never expose these ports to the internet.
