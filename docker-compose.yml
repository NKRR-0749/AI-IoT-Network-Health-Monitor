# Optional: run PostgreSQL and Mosquitto in Docker instead of installing them.
#   docker compose up -d
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: iot
      POSTGRES_PASSWORD: iot
      POSTGRES_DB: iot_monitor
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["1883:1883", "1884:1884"]
    volumes: ["./experiments/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
volumes:
  pgdata:
