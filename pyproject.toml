[project]
name = "iotmon"
version = "0.1.0"
description = "AI-driven IoT packet-loss pattern analysis and predictive network health monitoring"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
